name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this package you are using.
      placeholder: 3.0.0
    validations:
      required: true

  - type: input
    id: swiper-version
    attributes:
      label: Swiper version
      description: The version of Swiper you pass in through `SwiperModule` or load globally.
      placeholder: 12.0.1
    validations:
      required: true

  - type: dropdown
    id: import-method
    attributes:
      label: Import method
      description: How the package is loaded in your project.
      options:
        - ESM import (bundler)
        - UMD script tag
        - CDN URL
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js/npm versions, OS, and the browser (or WebView) where the problem shows up.
      placeholder: |
        Node.js: 24
        npm: 11
        OS: macOS 15
        Browser: Chrome 130 / iOS Safari 18
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Relevant options
      description: The options you pass to `new SimulateChat(...)`, with image and audio URLs replaced.
      render: javascript

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The console output around the failure, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here. A link to the online demo helps when the layout is involved.
