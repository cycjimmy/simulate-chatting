name: Coveralls

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coveralls:
    name: coveralls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and make test-coverage
        run: |
          npm ci
          npm run test:coverage

      # Coverage is reported, not enforced: the thresholds live in
      # `vitest.config.ts` and fail the Test CI job. Keep an outage or a
      # not-yet-enabled Coveralls repository from turning every pull request
      # red.
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
