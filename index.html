<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <link rel="shortcut icon" href="./favicon.ico">
  <title>Simulate Chatting</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    #wrapper {
      width: 320px;
      height: 520px;
      margin: 20px auto;
    }

    #start,
    #pause,
    #reset {
      display: block;
      text-align: center;
      width: 100px;
      margin: 10px auto;
    }

    .full {
      position: absolute;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="wrapper"></div>

  <a id="start" href="javascript:">START</a>
  <a id="pause" href="javascript:">PAUSE</a>
  <a id="reset" href="javascript:">RESET</a>

  <script type="module" src="./demo/main.ts"></script>
</body>
</html>
